[package]
name = "nib"
version = "0.1.0"
edition = "2021"
description = "Local-first grammar assistant"
authors = ["Baris Gunaydin"]
default-run = "nib"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["llm"]
# Default is the real app: Harper rules + local LLM rewrite. Pulls in
# llama-cpp-2 + builds llama.cpp from source. Adds ~2-5 min to the
# first build and requires cmake + a C++ toolchain on the host.
# `--no-default-features` is Harper-only intentionally (fast minimal build).
# The macOS AXUI overlay stays opt-in (`--features overlay`) because it
# needs macOS system frameworks; linux CI just uses the default
# (`--features llm` also works explicitly).
llm = ["dep:llama-cpp-2", "dep:anyhow", "dep:encoding_rs"]
# macOS-only — system-wide focus tracker + click-through overlay window that
# follows the focused text field across apps (Grammarly-style UX). Requires
# Accessibility permission at runtime. Enable with: `--features overlay`.
overlay = [
    "dep:accessibility",
    "dep:accessibility-sys",
    "dep:core-foundation",
    "dep:core-graphics",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "test", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harper-core = { version = "2", features = ["concurrent"] }
llama-cpp-2 = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
encoding_rs = { version = "0.8", optional = true }
# overlay-only (macOS)
accessibility = { version = "0.2", optional = true }
accessibility-sys = { version = "0.2", optional = true }
core-foundation = { version = "0.10", optional = true }
core-graphics = { version = "0.24", optional = true, features = ["elcapitan"] }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSWindow", "NSPanel", "NSScreen", "NSResponder", "NSView", "NSPasteboard", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSGeometry", "NSString", "NSData"] }

[[bin]]
name = "nib"
path = "src/main.rs"

[[bin]]
name = "nib-rewrite"
path = "src/bin/nib_rewrite.rs"
required-features = ["llm"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "harper_bench"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# Dev-loop release profile — same `release` directory layout so Tauri's
# bundler picks it up, but with fast-compile knobs. Use via
# `./scripts/install-dev.sh --fast` — ~3 min builds vs ~15 min for the
# full size-optimized release profile above. Binary is ~10MB bigger,
# which is fine for local iteration.
[profile.release-dev]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 1
strip = false
